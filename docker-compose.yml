services:
  flask:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: flask_app
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - CORS_ORIGINS=http://80.241.217.207
    volumes:
      - ./Data:/app/Data
      - flask_uploads:/app/backend/uploads
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nextjs:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://80.241.217.207
    container_name: nextjs_app
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      flask:
        condition: service_healthy
      nextjs:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  flask_uploads:
